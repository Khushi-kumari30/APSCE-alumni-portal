<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth_style.css">
    <title>Register | Alumni Portal</title>
</head>
<body>
    <div class="auth-container" style="width: 500px; margin: 50px auto; display: block;">
        <div class="auth-form-panel" style="width: 100%; box-sizing: border-box; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
            <h2 style="text-align: center;">Create Account</h2>
            
            <form id="registerForm">
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="usn">University Seat Number (USN)</label>
                    <input type="text" id="usn" name="usn" placeholder="e.g., 1AP21CS000" required style="text-transform: uppercase;">
                    <span id="usnError" style="color: red; font-size: 13px; display: none; margin-top: 5px; font-weight: bold;">
                        Access Denied: Registration is restricted to 1AP college students and alumni only.
                    </span>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="role">I am a:</label>
                    <select id="role" name="role" required>
                        <option value="student">Student</option>
                        <option value="alumni">Alumni</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter college email" required>
                </div>
                
                <button type="button" id="sendOtpBtn" class="btn-primary" style="width: 100%; margin-top: 5px;">Send OTP</button>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 8 characters" required minlength="8">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Verify OTP & Register</button>
            </form>

            <div class="auth-footer" style="text-align: center; margin-top: 15px;">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script>
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const emailInput = document.getElementById('email');
    const usnInput = document.getElementById('usn');
    const usnError = document.getElementById('usnError');
    const registerForm = document.getElementById('registerForm');

    function isUsnValid() {
        const usnValue = usnInput.value.trim().toUpperCase();
        if (!usnValue.startsWith('1AP')) {
            usnError.style.display = 'block';
            usnInput.style.borderColor = 'red';
            return false;
        }
        usnError.style.display = 'none';
        usnInput.style.borderColor = '';
        return true;
    }

    usnInput.addEventListener('input', () => {
        if (usnInput.value.trim().length >= 3) {
            isUsnValid();
        }
    });

    sendOtpBtn.addEventListener('click', async () => {
        if (!isUsnValid()) {
            alert("Registration blocked: Invalid institution code.");
            return;
        }

        const email = emailInput.value;
        if (!email) {
            alert("Please enter your college email first.");
            return;
        }

        sendOtpBtn.innerText = "Sending...";
        sendOtpBtn.disabled = true;

        try {
            const response = await fetch('http://localhost:5000/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            if (response.ok) {
                alert("OTP sent to your email!");
            } else {
                const data = await response.json();
                alert("Error: " + data.message);
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerText = "Send OTP";
            }
        } catch (error) {
            alert("Failed to connect to the server.");
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerText = "Send OTP";
        }
    });

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!isUsnValid()) {
            alert("Registration blocked: Invalid institution code.");
            return;
        }

        const formData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            usn: usnInput.value.trim().toUpperCase(),
            role: document.getElementById('role').value, 
            email: document.getElementById('email').value,
            otp: document.getElementById('otp').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('http://localhost:5000/api/verify-and-register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.ok) {
                // === AUTO-LOGIN STORAGE SYNC ===
                // Capture session tokens directly from registration response payload
                localStorage.setItem('alumniToken', result.token);
                localStorage.setItem('alumniUser', JSON.stringify(result.user));
                localStorage.setItem('alumniUserRole', result.user.role);

                alert(`Registration successful! Welcome to the portal, ${result.user.name}!`);

                // Instantly dispatch to user dashboards matching permissions matrix
                if (result.user.role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                } else {
                    window.location.href = 'index3.html';
                }
            } else {
                alert("Registration failed: " + result.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred. Please try again later.");
        }
    });
    </script>
</body>
</html>
