<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout</title>
    <link rel="stylesheet" href="css/logout.css">
    <meta http-equiv="refresh" content="5;url=login.html">
</head>
<body>

<div class="logout-container">
    <div class="logout-card">
        <h1 Logged Out Successfully></h1>
        <p>You have been safely logged out from the Alumni Portal.</p>
        <p class="redirect">Redirecting to login page in <span id="timer">5</span> seconds...</p>

        <a href="login.html" class="btn">Login Again</a>
    </div>
</div>

<script>
    localStorage.removeItem("authToken");
    localStorage.removeItem("authUser");

    let time = 5;
    const timer = document.getElementById("timer");

    setInterval(() => {
        time--;
        if (time >= 0) timer.innerText = time;
    }, 1000);
</script>

</body>
</html>
