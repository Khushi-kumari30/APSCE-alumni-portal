<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth_style.css">
    <title>Login | Alumni Portal</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-side-panel">
            <h1>Welcome back!</h1>
            <p>Sign in to access your account and continue your journey with us. We're glad to have you back!</p>
        </div>
        <div class="auth-form-panel">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Type your password" required>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 15px;">
                    <label><input type="checkbox" style="width: auto;"> Remember me</label>
                    <a href="#" style="color: var(--btn-color); text-decoration: none;">Forget password?</a>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // === FIXED SYNCHRONIZATION KEYS ===
                    // Saving with precise ecosystem labels so mentorship.html reads them perfectly
                    localStorage.setItem('alumniToken', data.token);
                    localStorage.setItem('alumniUser', JSON.stringify(data.user));
                    localStorage.setItem('alumniUserRole', data.user.role); 

                    alert(`Welcome back, ${data.user.name}!`);

                    // Redirect based on role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        window.location.href = 'index3.html'; 
                    }
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error('Login Error:', err);
                alert('Connection to server failed.');
            }
        });
    </script>
</body>
</html>
