<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Alumni Portal</title>
    <link rel="stylesheet" href="css/index3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="top-header">
    <a href="index3.html" class="logo">
        <i class="fa-solid fa-graduation-cap"></i> Alumni Portal
    </a>
    <div class="college-name">APS College of Engineering</div>
    
    <div class="user-menu">
        <span class="welcome-text" id="userWelcomeText">Hi, User</span>
        <button class="logout-btn" onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-left: 10px;">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </div>
</div>

<div class="layout">
    <aside class="sidebar">
      <ul class="nav-links">
        <li><a href="index3.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> My Profile</a></li>
        <li><a href="directory.html"><i class="fa-solid fa-users"></i> Alumni Directory</a></li>
        <li><a href="Events.html"><i class="fa-solid fa-calendar-days"></i> Events & Reunions</a></li>
        <li><a href="Achivement.html"><i class="fa-solid fa-trophy"></i> Achievements</a></li>
        <li><a href="mentorship.html"><i class="fa-solid fa-handshake-angle"></i> Mentorship</a></li>
        <li><a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact Us</a></li>
      </ul>
    </aside>

    <div class="content" style="padding: 30px; overflow-y: auto; background-color: #f8fafc; flex: 1;">
        <div class="profile-card" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 900px; margin: 0 auto;">
            <h3 style="color: #1e293b; font-size: 24px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 10px;">Edit Profile Information</h3>
            <p style="margin-bottom: 25px; font-size: 0.9em; color: #64748b;">Update your details, add a professional photo, and hit Save.</p>

            <form id="profileForm">
                <div class="photo-upload-section" style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                    <div class="photo-preview" style="width: 100px; height: 100px; border-radius: 50%; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 3px solid #38bdf8;">
                        <i id="defaultUserIcon" class="fa-solid fa-user" style="font-size: 40px; color: #94a3b8;"></i>
                        <img id="imagePreview" src="" alt="Preview" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div>
                        <label for="profilePhoto" style="display: block; font-weight: bold; margin-bottom: 8px; color: #334155;">Profile Picture</label>
                        <input type="file" id="profilePhoto" name="profile_photo" accept="image/*" style="font-size: 14px;">
                    </div>
                </div>

                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">First Name</label>
                        <input type="text" id="firstName" name="first_name" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Last Name</label>
                        <input type="text" id="lastName" name="last_name" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Email (Read-only)</label>
                        <input type="email" id="displayEmail" readonly style="width: 100%; padding: 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; color: #64748b;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Phone No</label>
                        <input type="tel" id="phone" name="phone" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">USN</label>
                        <input type="text" id="usn" name="usn" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Branch</label>
                        <input type="text" id="branch" name="branch" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Year of Graduation</label>
                        <input type="number" id="year_passed" name="year_passed" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div></div>

                    <div id="companyFieldWrapper">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Company</label>
                        <input type="text" id="company" name="company" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div id="designationFieldWrapper">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Designation</label>
                        <input type="text" id="designation" name="designation" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Work Location</label>
                        <input type="text" id="location" name="location" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Short Bio</label>
                    <textarea id="bio" name="bio" rows="4" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical;"></textarea>
                </div>

                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">LinkedIn URL</label>
                        <input type="url" id="linkedin" name="linkedin" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">GitHub URL</label>
                        <input type="url" id="github" name="github" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Core Skills</label>
                    <input type="text" id="skills" name="skills" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>

                <div id="mentorshipFieldWrapper" style="margin-top: 20px; padding: 15px; background-color: #f0f9ff; border-radius: 6px; border-left: 4px solid #0ea5e9;">
                    <label style="display: flex; align-items: center; font-weight: 600; color: #0369a1; cursor: pointer;">
                        <input type="checkbox" id="open_to_mentoring" name="open_to_mentoring" style="margin-right: 10px; width: 18px; height: 18px;">
                        I am open to mentoring students or providing referrals.
                    </label>
                </div>

                <div class="btn-group" style="margin-top: 30px; text-align: right;">
                    <button type="submit" class="update" style="background: #112b5f; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                        <i class="fa fa-save"></i> Save Profile to Database
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let base64ImageString = "";

async function logout() {
    if (!confirm("Are you sure you want to log out?")) return;
    const token = localStorage.getItem('alumniToken');
    try {
        await fetch('http://localhost:5000/api/logout', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
    } catch (err) { console.error(err); }

    localStorage.clear();
    window.location.replace('login.html');
}

document.getElementById('profilePhoto').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            base64ImageString = e.target.result; 
            document.getElementById('imagePreview').src = base64ImageString;
            document.getElementById('imagePreview').style.display = 'block';
            if(document.getElementById('defaultUserIcon')) document.getElementById('defaultUserIcon').style.display = 'none';
        }
        reader.readAsDataURL(file);
    }
});

document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('alumniToken');
    const userRole = localStorage.getItem('alumniUserRole') || 'alumni';
    if (!token) { window.location.replace('login.html'); return; }

    if (userRole.toLowerCase() === 'student') {
        document.getElementById('companyFieldWrapper').style.display = 'none';
        document.getElementById('designationFieldWrapper').style.display = 'none';
        document.getElementById('mentorshipFieldWrapper').style.display = 'none';
    }

    try {
        const res = await fetch('http://localhost:5000/api/get-profile', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('userWelcomeText').innerText = `Hi, ${data.first_name || 'User'}`;
            localStorage.setItem('alumniUserName', data.first_name || '');

            document.getElementById('firstName').value = data.first_name || '';
            document.getElementById('lastName').value = data.last_name || '';
            document.getElementById('displayEmail').value = data.email || '';
            document.getElementById('phone').value = data.phone_no || ''; 
            document.getElementById('usn').value = data.usn || '';
            document.getElementById('branch').value = data.branch || '';
            document.getElementById('year_passed').value = data.passing_year || '';
            document.getElementById('company').value = data.company || '';
            document.getElementById('designation').value = data.designation || '';
            document.getElementById('location').value = data.work_location || '';
            document.getElementById('bio').value = data.bio || '';
            document.getElementById('linkedin').value = data.linkedin_url || '';
            document.getElementById('github').value = data.github_url || ''; 
            document.getElementById('skills').value = data.skills || '';
            document.getElementById('open_to_mentoring').checked = data.is_mentor == 1; 

            if (data.profile_photo_path) {
                base64ImageString = data.profile_photo_path;
                document.getElementById('imagePreview').src = data.profile_photo_path;
                document.getElementById('imagePreview').style.display = 'block';
                if(document.getElementById('defaultUserIcon')) document.getElementById('defaultUserIcon').style.display = 'none';
            }
        }
    } catch (err) { console.error(err); }
});

document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('alumniToken');
    const profileData = {
        phone_no: document.getElementById('phone').value, 
        usn: document.getElementById('usn').value,
        branch: document.getElementById('branch').value,
        passing_year: document.getElementById('year_passed').value,
        company: document.getElementById('company').value,
        designation: document.getElementById('designation').value,
        work_location: document.getElementById('location').value,
        bio: document.getElementById('bio').value,
        linkedin_url: document.getElementById('linkedin').value,
        github_url: document.getElementById('github').value, 
        skills: document.getElementById('skills').value,
        profile_photo_path: base64ImageString, 
        is_mentor: document.getElementById('open_to_mentoring').checked ? 1 : 0 
    };

    try {
        const res = await fetch('http://localhost:5000/api/update-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(profileData)
        });
        if (res.ok) alert("Profile updated successfully!");
    } catch (err) { console.error(err); }
});
</script>
</body>
</html>
